<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jelly loop-de-loop tour demo</title>
<style>
  body{margin:0;font-family:'Space Grotesk',sans-serif;background:#fdfbf6;color:#12314d;}
  nav{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;background:#fdfbf6;border-bottom:1px solid rgba(18,49,77,0.1);}
  .brand{font-weight:800;font-size:1.3rem;}
  .nav-links{display:flex;gap:20px;}
  .nav-links a{color:#38506c;text-decoration:none;font-weight:600;cursor:default;}
  #profileIcon{width:34px;height:34px;border-radius:999px;background:#F7DE89;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:default;}
  main{max-width:900px;margin:0 auto;padding:60px 24px;text-align:center;}
  h1{font-size:2.4rem;margin-bottom:14px;}
  p{color:#38506c;margin-bottom:28px;}
  #seeTestBtn{padding:14px 28px;border-radius:100px;background:linear-gradient(135deg,#f4d86b,#f39b5b);border:none;font-weight:700;font-size:1rem;cursor:pointer;}
  #startTourBtn{margin-top:50px;padding:12px 22px;border-radius:100px;background:#102d44;color:#faf8f4;border:none;font-weight:700;cursor:pointer;}

  #jellyFlightWrap{position:fixed;left:0;top:0;width:1px;height:1px;transform-origin:0 0;pointer-events:none;z-index:500;}
  #jellyFlyer{position:absolute;width:64px;height:77px;margin-left:-32px;margin-top:-38px;}
  #jellyVisual{width:100%;height:100%;}

  #jellyBubble{
    position:fixed;z-index:600;background:#faf8f4;border:1px solid rgba(18,49,77,0.12);
    border-radius:16px;padding:12px 16px;max-width:220px;font-size:0.85rem;line-height:1.4;
    box-shadow:0 12px 30px rgba(18,49,77,0.18);opacity:0;transform:scale(.9);
    transition:opacity .25s ease, transform .25s ease;pointer-events:none;
  }
  #jellyBubble.show{opacity:1;transform:scale(1);}
  #jellyBubble b{display:block;margin-bottom:4px;font-size:0.78rem;}
</style>
</head>
<body>

<nav>
  <div class="brand">ILI</div>
  <div class="nav-links">
    <a href="#">Home</a>
    <a href="#" id="navDiscover">Discover</a>
    <a href="#">My Patterns</a>
  </div>
  <div id="profileIcon" title="Profile">🙂</div>
</nav>

<main>
  <h1>sew your pinterest inspos into your wardrobe</h1>
  <p>This is a demo of Jelly flying loop-de-loop between page elements to guide someone around, like a little animated tour.</p>
  <button id="seeTestBtn">🔍 see the test</button>
  <br>
  <button id="startTourBtn">▶ Start Jelly Tour</button>
</main>

<div id="jellyFlightWrap">
  <div id="jellyFlyer">
    <svg id="jellyVisual" viewBox="0 0 100 120">
      <defs>
        <linearGradient id="jellyGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ff9fd6"/>
          <stop offset="100%" stop-color="#8b5cf6"/>
        </linearGradient>
      </defs>
      <path d="M20,55 C20,18 80,18 80,55 C80,66 70,60 65,54 C65,66 55,60 50,54 C50,66 40,60 35,54 C35,66 25,60 20,55 Z" fill="url(#jellyGrad)"/>
      <circle cx="38" cy="40" r="4" fill="#102d44"/>
      <circle cx="62" cy="40" r="4" fill="#102d44"/>
      <path d="M42,49 Q50,55 58,49" stroke="#102d44" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M30,58 Q25,76 30,94 Q35,76 30,58" fill="#ff9fd6" opacity="0.85"/>
      <path d="M44,58 Q39,80 44,102 Q49,80 44,58" fill="#c4b0fb" opacity="0.85"/>
      <path d="M56,58 Q51,80 56,102 Q61,80 56,58" fill="#ff9fd6" opacity="0.85"/>
      <path d="M70,58 Q65,76 70,94 Q75,76 70,58" fill="#c4b0fb" opacity="0.85"/>
    </svg>
  </div>
</div>

<div id="jellyBubble"><b>Jelly says:</b><span id="jellyBubbleText"></span></div>

<script>
  // A loop-de-loop path drawn in local units from (0,0) to (300,0),
  // with two full loops along the way. Every flight reuses this exact
  // shape — only the wrapper's position/rotation/scale changes per trip.
  const BASE_LEN = 300;
  const LOOP_PATH_D = "M0,0 L40,0 A18,18 0 1,1 76,0 A18,18 0 1,1 40,0 L140,0 A18,18 0 1,1 176,0 A18,18 0 1,1 140,0 L300,0";

  const wrap = document.getElementById('jellyFlightWrap');
  const flyer = document.getElementById('jellyFlyer');
  const visual = document.getElementById('jellyVisual');
  const bubble = document.getElementById('jellyBubble');
  const bubbleText = document.getElementById('jellyBubbleText');

  let curX = window.innerWidth - 70;
  let curY = 120;

  function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

  function flyTo(el, duration = 2200){
    return new Promise(resolve => {
      const rect = el.getBoundingClientRect();
      const targetX = rect.left + rect.width / 2;
      const targetY = rect.top + rect.height / 2;
      const dx = targetX - curX, dy = targetY - curY;
      const dist = Math.hypot(dx, dy) || 1;
      const angleDeg = Math.atan2(dy, dx) * 180 / Math.PI;
      const scale = dist / BASE_LEN;

      wrap.style.transition = 'none';
      wrap.style.transform = `translate(${curX}px, ${curY}px) rotate(${angleDeg}deg) scale(${scale})`;
      visual.style.transform = `scale(${1 / scale})`;
      visual.style.transformOrigin = 'center';

      flyer.style.offsetPath = `path('${LOOP_PATH_D}')`;
      flyer.style.offsetRotate = 'auto';
      flyer.style.transition = 'none';
      flyer.style.offsetDistance = '0%';
      // force reflow so the transition below actually animates
      void flyer.offsetWidth;
      flyer.style.transition = `offset-distance ${duration}ms ease-in-out`;
      requestAnimationFrame(() => { flyer.style.offsetDistance = '100%'; });

      setTimeout(() => {
        curX = targetX;
        curY = targetY;
        resolve();
      }, duration + 60);
    });
  }

  function showBubble(text, x, y){
    bubbleText.textContent = text;
    const bw = 220;
    let left = x - bw / 2;
    left = Math.max(10, Math.min(window.innerWidth - bw - 10, left));
    bubble.style.left = left + 'px';
    bubble.style.top = (y + 36) + 'px';
    bubble.classList.add('show');
  }
  function hideBubble(){ bubble.classList.remove('show'); }

  const TOUR = [
    { selector: '#profileIcon', message: "Click here to build your avatar and save your measurements!" },
    { selector: '#navDiscover', message: "Browse all the patterns here \u2014 filter by vibe!" },
    { selector: '#seeTestBtn', message: "Or just click this to jump straight into the test version!" }
  ];

  async function runTour(){
    document.getElementById('startTourBtn').disabled = true;
    for (const stop of TOUR){
      const el = document.querySelector(stop.selector);
      if (!el) continue;
      await flyTo(el);
      showBubble(stop.message, curX, curY);
      await wait(2600);
      hideBubble();
      await wait(300);
    }
    document.getElementById('startTourBtn').disabled = false;
  }

  document.getElementById('startTourBtn').addEventListener('click', runTour);

  // place Jelly at her resting spot on load
  wrap.style.transform = `translate(${curX}px, ${curY}px) rotate(0deg) scale(1)`;
</script>

</body>
</html>
